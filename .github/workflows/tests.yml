name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias do sistema para Qt/PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 \
            libfontconfig1 libdbus-1-3 libxkbcommon0 libxcb-cursor0

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rodar testes
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/check_template_update.py

      - name: Upload de screenshots (se testes de UI falharem)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/ui/screenshots/
          if-no-files-found: ignore